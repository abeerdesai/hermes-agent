name: Weekly upstream sync PR

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-upstream-sync
  cancel-in-progress: false

jobs:
  open-sync-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the controlled fork
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Merge current upstream into the automation branch
        id: sync
        env:
          SYNC_BRANCH: automation/weekly-upstream-sync
          UPSTREAM_URL: https://github.com/NousResearch/hermes-agent.git
        run: |
          set -euo pipefail
          git config user.name "hermes-release-bot"
          git config user.email "hermes-release-bot@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main
          if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH"
          fi
          git checkout -B "$SYNC_BRANCH" origin/main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-edit upstream/main
          git push --force-with-lease origin "$SYNC_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"
          echo "sync_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open or refresh the governed sync pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: automation/weekly-upstream-sync
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          SYNC_SHA: ${{ steps.sync.outputs.sync_sha }}
        run: |
          set -euo pipefail
          existing="$(
            gh pr list \
              --head "$SYNC_BRANCH" \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          body="$RUNNER_TEMP/hermes-upstream-sync.md"
          {
            echo "## Outcome"
            echo
            echo "Merge current NousResearch \`main\` into the controlled fork through review."
            echo
            echo "- upstream SHA: \`$UPSTREAM_SHA\`"
            echo "- sync SHA: \`$SYNC_SHA\`"
            echo "- source workflow: \`weekly-upstream-sync.yml\`"
            echo
            echo "Merging this PR updates only the controlled fork. It does not approve a release,"
            echo "activate a profile, or change production."
          } > "$body"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "chore(release): weekly upstream sync" --body-file "$body"
          else
            gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore(release): weekly upstream sync" \
              --body-file "$body"
          fi
